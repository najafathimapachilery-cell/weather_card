<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-card">

        <h1>Weather Today</h1>

        <div class="weather-icon">☀️</div>

        <h2>Kozhikode</h2>

        <div class="temperature">30°C</div>

        <p class="condition">Sunny</p>

        <div class="details">

            <div>
                <span>💧</span>
                <p>Humidity</p>
                <strong>65%</strong>
            </div>

            <div>
                <span>💨</span>
                <p>Wind</p>
                <strong>12 km/h</strong>
            </div>

        </div>

        <button onclick="showMessage()">Check Weather</button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
